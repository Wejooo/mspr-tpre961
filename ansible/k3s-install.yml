---
# Install K3s server on the control-plane node
- name: Prepare all nodes for Kubernetes
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Load br_netfilter kernel module
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Persist br_netfilter across reboots
      ansible.builtin.copy:
        content: "br_netfilter"
        dest: /etc/modules-load.d/br_netfilter.conf
        mode: "0644"

    - name: Enable required sysctl parameters
      ansible.builtin.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_set: true
        reload: true
      loop:
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-ip6tables
        - net.ipv4.ip_forward

    - name: Disable swap
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Remove swap entries from fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '# \1'

- name: Install K3s server on control-plane
  hosts: control_plane
  become: true
  tasks:
    - name: Check if K3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Install K3s server
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          INSTALL_K3S_EXEC="server" \
          sh -s - \
            --node-ip {{ control_plane_ip }} \
            --write-kubeconfig-mode 644 \
            --disable-cloud-controller \
            --tls-san {{ control_plane_ip }}
      args:
        creates: /usr/local/bin/k3s
      when: not k3s_binary.stat.exists

    - name: Wait for K3s to be ready
      ansible.builtin.command: kubectl get nodes
      register: k3s_ready
      until: k3s_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Read K3s node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_raw

    - name: Store token as fact
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_token_raw.content | b64decode | trim }}"

    - name: Read kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig_raw

    - name: Store kubeconfig as fact
      ansible.builtin.set_fact:
        k3s_kubeconfig: "{{ k3s_kubeconfig_raw.content | b64decode }}"

- name: Configure kubectl on the Ansible controller
  hosts: localhost
  connection: local
  tasks:
    - name: Create ~/.kube directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.kube"
        state: directory
        mode: "0700"

    - name: Write kubeconfig locally
      ansible.builtin.copy:
        content: "{{ hostvars['control-plane']['k3s_kubeconfig'] | regex_replace('127\\.0\\.0\\.1', control_plane_ip) }}"
        dest: "{{ ansible_env.HOME }}/.kube/config"
        mode: "0600"
