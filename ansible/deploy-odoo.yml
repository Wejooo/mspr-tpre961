---
# Deploy Odoo 18 LTS via Helm on the K3s cluster
- name: Deploy Odoo 18 with Helm
  hosts: control_plane
  become: true
  vars:
    odoo_namespace: "default"
    odoo_release_name: "odoo"
    odoo_hostname: "odoo.local"
  tasks:
    - name: Check if Helm is installed
      ansible.builtin.command: helm version --short
      register: helm_check
      changed_when: false
      failed_when: false

    - name: Install Helm
      ansible.builtin.shell: |
        curl -fsSL https://get.helm.sh/helm-v4.1.4-linux-amd64.tar.gz -o /tmp/helm.tar.gz
        tar xzf /tmp/helm.tar.gz -C /tmp/
        mv /tmp/linux-amd64/helm /usr/local/bin/helm
        rm -rf /tmp/linux-amd64 /tmp/helm.tar.gz
      args:
        creates: /usr/local/bin/helm
      when: helm_check.rc != 0

    - name: Generate self-signed TLS certificate for odoo.local
      ansible.builtin.shell: |
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout /tmp/tls.key -out /tmp/tls.crt \
          -subj "/CN={{ odoo_hostname }}/O=MSPR-TPRE961"
      args:
        creates: /tmp/tls.crt

    - name: Create TLS secret in Kubernetes
      ansible.builtin.shell: |
        kubectl create secret tls odoo-tls \
          --cert=/tmp/tls.crt --key=/tmp/tls.key \
          -n {{ odoo_namespace }} --dry-run=client -o yaml | \
        kubectl apply -f -
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false

    - name: Deploy Odoo via Helm
      kubernetes.core.helm:
        name: "{{ odoo_release_name }}"
        chart_ref: "oci://registry-1.docker.io/bitnamicharts/odoo"
        release_namespace: "{{ odoo_namespace }}"
        create_namespace: true
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        values:
          image:
            registry: docker.io
            repository: bitnami/odoo
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
          persistence:
            size: "5Gi"
          service:
            type: ClusterIP
          ingress:
            enabled: true
            ingressClassName: traefik
            hostname: "{{ odoo_hostname }}"
            tls: true
            selfSigned: false
            extraTls:
              - hosts:
                  - "{{ odoo_hostname }}"
                secretName: odoo-tls
          postgresql:
            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"

    - name: Wait for Odoo pod to be Running
      ansible.builtin.shell: |
        kubectl get pods -n {{ odoo_namespace }} -l app.kubernetes.io/name=odoo \
          -o jsonpath='{.items[0].status.phase}'
      register: odoo_pod_status
      until: odoo_pod_status.stdout == "Running"
      retries: 60
      delay: 15
      changed_when: false
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Configure local access to Odoo
  hosts: localhost
  connection: local
  become: true
  tasks:
    - name: Add odoo.local to /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '.*odoo\.local$'
        line: "192.168.100.10 odoo.local"
        state: present
