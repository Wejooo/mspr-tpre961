---
# Deploy Odoo 18 LTS via Helm on the K3s cluster
- name: Deploy Odoo 18 with Helm
  hosts: localhost
  connection: local
  vars:
    odoo_namespace: "default"
    odoo_release_name: "odoo"
    odoo_hostname: "odoo.local"
    kubeconfig_path: "{{ ansible_env.HOME }}/.kube/config"
  environment:
    KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
  tasks:
    - name: Generate self-signed TLS certificate for odoo.local
      ansible.builtin.shell: |
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout /tmp/tls.key -out /tmp/tls.crt \
          -subj "/CN={{ odoo_hostname }}/O=MSPR-TPRE961"
      args:
        creates: /tmp/tls.crt

    - name: Create TLS secret in Kubernetes
      ansible.builtin.shell: |
        kubectl create secret tls odoo-tls \
          --cert=/tmp/tls.crt --key=/tmp/tls.key \
          -n {{ odoo_namespace }} --dry-run=client -o yaml | \
        kubectl apply -f -
      changed_when: false

    - name: Write Helm values file
      ansible.builtin.copy:
        dest: /tmp/odoo-values.yml
        mode: "0644"
        content: |
          global:
            security:
              allowInsecureImages: true
          image:
            registry: docker.io
            repository: bitnamilegacy/odoo
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
          persistence:
            size: "5Gi"
          service:
            type: ClusterIP
          ingress:
            enabled: true
            ingressClassName: traefik
            hostname: {{ odoo_hostname }}
            tls: true
            selfSigned: false
            extraTls:
              - hosts:
                  - {{ odoo_hostname }}
                secretName: odoo-tls
          postgresql:
            image:
              registry: docker.io
              repository: bitnamilegacy/postgresql
            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"

    - name: Check if Odoo is already deployed
      ansible.builtin.shell: helm status {{ odoo_release_name }} -n {{ odoo_namespace }} 2>/dev/null
      register: helm_status
      changed_when: false
      failed_when: false

    - name: Deploy Odoo via Helm
      ansible.builtin.shell: |
        helm install {{ odoo_release_name }} \
          oci://registry-1.docker.io/bitnamicharts/odoo \
          -n {{ odoo_namespace }} \
          -f /tmp/odoo-values.yml \
          --timeout 20m
      when: helm_status.rc != 0

    - name: Wait for Odoo pod to be Running
      ansible.builtin.shell: |
        kubectl get pods -n {{ odoo_namespace }} -l app.kubernetes.io/name=odoo \
          --no-headers -o custom-columns=STATUS:.status.phase 2>/dev/null | head -1
      register: odoo_pod_status
      until: odoo_pod_status.stdout == "Running"
      retries: 60
      delay: 15
      changed_when: false

    - name: Show Odoo access information
      ansible.builtin.debug:
        msg: |
          Odoo is deployed and running!
          URL: https://{{ odoo_hostname }}
          Default email: user@example.com
          Get password: kubectl get secret odoo -o jsonpath="{.data.odoo-password}" | base64 -d

- name: Configure local access to Odoo
  hosts: localhost
  connection: local
  become: true
  tasks:
    - name: Add odoo.local to /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '.*odoo\.local$'
        line: "192.168.100.10 odoo.local"
        state: present
