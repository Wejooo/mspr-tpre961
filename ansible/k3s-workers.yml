---
# Join worker nodes to the K3s cluster
- name: Retrieve K3s token from control-plane
  hosts: control_plane
  become: true
  tasks:
    - name: Read K3s node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_raw

    - name: Store token as fact
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_token_raw.content | b64decode | trim }}"

- name: Install K3s agent on worker nodes
  hosts: workers
  become: true
  vars:
    k3s_server_url: "https://{{ control_plane_ip }}:6443"
    k3s_token: "{{ hostvars[groups['control_plane'][0]]['k3s_token'] }}"
  tasks:
    - name: Check if K3s agent is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Install K3s agent
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          K3S_URL="{{ k3s_server_url }}" \
          K3S_TOKEN="{{ k3s_token }}" \
          sh -
      args:
        creates: /usr/local/bin/k3s
      when: not k3s_binary.stat.exists

    - name: Wait for K3s agent service to start
      ansible.builtin.service:
        name: k3s-agent
        state: started
        enabled: true

- name: Verify cluster nodes
  hosts: control_plane
  become: true
  tasks:
    - name: Wait for all nodes to be Ready
      ansible.builtin.shell: |
        kubectl get nodes --no-headers | grep -c ' Ready'
      register: ready_nodes
      until: ready_nodes.stdout | int >= 3
      retries: 30
      delay: 10
      changed_when: false
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
